name: Idea
description: Suggest something new for RP Forge, or a change to something that exists.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Have a look at the [roadmap](https://github.com/NotThatSiri/RPForge/blob/main/ROADMAP.md) first: your idea may already be planned.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to be able to do in game?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help your roleplay?
      description: The story or situation where you'd use it.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of RP Forge?
      options:
        - Window and settings
        - Profile and persona
        - Chat and session log
        - Character sheet and health
        - Places and triggers
        - Items, vendors and packs
        - Quests, bounties and contracts
        - Professions and businesses
        - Progression, Houses and guild companies
        - Campaigns
        - Something else
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Examples, sketches or screenshots.
